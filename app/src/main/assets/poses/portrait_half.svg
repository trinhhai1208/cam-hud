<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Half-body Portrait Pose Guide: Head centered on top 1/3 eye-line (y=33.3) -->
  <!-- Head Contour -->
  <ellipse cx="50" cy="34" rx="9" ry="11.5" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <!-- Eye-line Markers -->
  <line x1="44" y1="33.3" x2="48" y2="33.3" stroke="#FACC15" stroke-width="1.2"/>
  <line x1="52" y1="33.3" x2="56" y2="33.3" stroke="#FACC15" stroke-width="1.2"/>
  <!-- Neck & Asymmetric Relaxed Shoulders -->
  <path d="M 46 45 L 45 50 L 28 56 C 23 58 21 66 20 88 M 54 45 L 55 50 L 72 54 C 77 56 79 64 80 88" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-dasharray="3,2"/>
  <!-- Safe Crop Zone (Above Elbows / Below Waist) -->
  <line x1="25" y1="88" x2="75" y2="88" stroke="#10B981" stroke-width="0.7" stroke-dasharray="4,2"/>
</svg>
